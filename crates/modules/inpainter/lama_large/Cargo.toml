[package]
name = "lama_large"
version.workspace = true
edition.workspace = true

[dependencies]
interface-model.workspace = true
interface-inpainter.workspace = true
interface-image.workspace = true
anyhow.workspace = true
ndarray.workspace = true
ort.workspace = true
base-util.workspace = true
maplit.workspace = true
util.workspace = true
async-trait.workspace = true

[dev-dependencies]
ndarray-npy.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
env_logger.workspace = true

# The bench example only sees CoreML if this crate's own graph enables it (runtimes do so via
# their own `ort` dependency, which does not propagate to `cargo run -p lama_large`).
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "visionos"))'.dev-dependencies]
ort = { workspace = true, features = ["coreml"] }

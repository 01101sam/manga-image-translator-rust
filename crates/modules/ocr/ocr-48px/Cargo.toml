[package]
name = "ocr-48px"
version.workspace = true
edition.workspace = true

[dependencies]
ort.workspace = true
ndarray.workspace = true
interface-image.workspace = true
image.workspace = true
ndarray-stats.workspace = true
interface-ocr.workspace = true
async-trait.workspace = true
anyhow.workspace = true
interface-detector.workspace = true
util.workspace = true
interface-model.workspace = true
maplit.workspace = true
base-util.workspace = true
parking_lot.workspace = true
opencv.workspace = true
ordered-float.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# 单独运行测试时启用 CoreML，与 Apple 应用入口的构建保持一致。
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "visionos"))'.dev-dependencies]
ort = { workspace = true, features = ["coreml"] }

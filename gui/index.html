<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>图片翻译</title>
    <style>
      body { font-family: sans-serif; margin: 1.5rem; }
      nav button { margin-right: 0.5rem; }
      nav button.active { font-weight: bold; }
      section { margin-top: 1rem; }
      label { display: inline-block; margin-right: 1rem; margin-bottom: 0.5rem; }
      textarea { width: 100%; min-height: 24rem; font-family: monospace; }
      #error { color: #b00020; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>图片翻译</h1>
    <p id="pairbar">
      <span id="pairmsg">未配对。先请求验证码，再输入 Daemon 控制台中的 6 位数字。</span>
      <button type="button" id="pair_request">请求配对码</button>
      <label>验证码 <input id="pair_code" maxlength="6" inputmode="numeric" /></label>
      <button type="button" id="pair_confirm">确认</button>
    </p>
    <p id="svcbar">
      <span id="svcmsg">引擎：已停止</span>
      <button type="button" id="svc_start">启动</button>
      <button type="button" id="svc_stop" disabled>关闭</button>
      <button type="button" id="svc_restart">重启</button>
    </p>
    <nav>
      <button type="button" id="tab_play" class="active">翻译</button>
      <button type="button" id="tab_cfg">配置</button>
    </nav>

    <section id="panel_play">
      <form id="f">
        <p>
          <label>图片 <input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" required /></label>
        </p>
        <p>
          <label>目标语言
            <select name="target_lang">
              <option value="chs" selected>简体中文</option>
              <option value="cht">繁体中文</option>
              <option value="en">英文</option>
              <option value="ja">日文</option>
            </select>
          </label>
          <label>检测器
            <select name="detector">
              <option>DBNet</option>
              <option>Ctd</option>
            </select>
          </label>
          <label>翻译器
            <select name="translator">
              <option value="Llm" selected>LLM</option>
              <option value="Original">按原文输出</option>
              <option value="None">不输出文字</option>
            </select>
          </label>
        </p>
        <p><button type="submit">提交</button></p>
      </form>
      <p id="status"></p>
      <pre id="error"></pre>
      <p>
        <img id="result" hidden />
      </p>
      <iframe id="html" hidden></iframe>
      <p><a id="dl" hidden>下载结果</a></p>
    </section>

    <section id="panel_cfg" hidden>
      <p>配置保存在 Daemon 本机。保存后立即写入 config.json。</p>
      <p>
        <button type="button" id="cfg_load">重新加载</button>
        <button type="button" id="cfg_save">保存</button>
      </p>
      <textarea id="cfg_json" spellcheck="false"></textarea>
    </section>

    <script>
      const $ = (id) => document.getElementById(id);
      const TOKEN_KEY = "imagetranslator_token";
      let token = localStorage.getItem(TOKEN_KEY) || "";
      let engineState = "stopped";

      function authHeaders(extra) {
        const h = extra ? { ...extra } : {};
        if (token) h.Authorization = "Bearer " + token;
        return h;
      }

      function setPairMsg() {
        $("pairmsg").textContent = token
          ? "已配对。后续请求携带本地保存的令牌。"
          : "未配对。先请求验证码，再输入 Daemon 控制台中的 6 位数字。";
      }

      function engineLabel(state) {
        return (
          {
            stopped: "已停止",
            starting: "启动中",
            running: "运行中",
            draining: "排空中",
          }[state] || state
        );
      }

      function renderEngine(d) {
        engineState = d.state || "stopped";
        $("svcmsg").textContent = "引擎：" + engineLabel(engineState);
        $("svc_start").disabled = engineState === "running" || engineState === "starting";
        $("svc_stop").disabled = engineState === "stopped";
      }

      async function readJson(res) {
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch {
          throw new Error("非 JSON 响应 HTTP " + res.status);
        }
      }

      async function pollEngine() {
        if (!token) return;
        try {
          const res = await fetch("/engine/status", { headers: authHeaders() });
          if (res.status === 401) return;
          renderEngine(await readJson(res));
        } catch {
          $("svcmsg").textContent = "引擎：无法连接";
        }
      }

      async function engineAction(path) {
        if (!token) {
          $("error").textContent = "请先完成配对";
          return;
        }
        try {
          const res = await fetch(path, { method: "POST", headers: authHeaders() });
          const d = await readJson(res);
          if (!res.ok) {
            $("error").textContent = d.error || "引擎操作失败";
            return;
          }
          renderEngine(d);
        } catch (err) {
          $("error").textContent = String(err);
        }
      }

      $("pair_request").onclick = async () => {
        $("error").textContent = "";
        try {
          const res = await fetch("/pair/request", { method: "POST" });
          const d = await readJson(res);
          if (!res.ok) {
            $("error").textContent = d.error || "请求配对失败";
            return;
          }
          $("pairmsg").textContent = "已请求。请查看 Daemon 控制台中的 6 位数字，30 秒内确认。";
        } catch (err) {
          $("error").textContent = String(err);
        }
      };

      $("pair_confirm").onclick = async () => {
        $("error").textContent = "";
        try {
          const res = await fetch("/pair/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: $("pair_code").value.trim() }),
          });
          const d = await readJson(res);
          if (!res.ok) {
            $("error").textContent = d.error || "确认失败";
            return;
          }
          token = d.token;
          localStorage.setItem(TOKEN_KEY, token);
          setPairMsg();
          pollEngine();
          loadConfig();
        } catch (err) {
          $("error").textContent = String(err);
        }
      };

      $("svc_start").onclick = () => engineAction("/engine/start");
      $("svc_stop").onclick = () => engineAction("/engine/stop");
      $("svc_restart").onclick = () => engineAction("/engine/restart");

      function showTab(which) {
        const play = which === "play";
        $("panel_play").hidden = !play;
        $("panel_cfg").hidden = play;
        $("tab_play").className = play ? "active" : "";
        $("tab_cfg").className = play ? "" : "active";
      }
      $("tab_play").onclick = () => showTab("play");
      $("tab_cfg").onclick = () => {
        showTab("cfg");
        loadConfig();
      };

      async function loadConfig() {
        if (!token) return;
        try {
          const res = await fetch("/config", { headers: authHeaders() });
          const d = await readJson(res);
          if (!res.ok) {
            $("error").textContent = d.error || "读取配置失败";
            return;
          }
          $("cfg_json").value = JSON.stringify(d, null, 2);
        } catch (err) {
          $("error").textContent = String(err);
        }
      }

      $("cfg_load").onclick = loadConfig;
      $("cfg_save").onclick = async () => {
        if (!token) {
          $("error").textContent = "请先完成配对";
          return;
        }
        let body;
        try {
          body = JSON.parse($("cfg_json").value);
        } catch (err) {
          $("error").textContent = "配置 JSON 无效";
          return;
        }
        try {
          const res = await fetch("/config", {
            method: "PUT",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify(body),
          });
          const d = await readJson(res);
          if (!res.ok) {
            $("error").textContent = d.error || "保存配置失败";
            return;
          }
          $("cfg_json").value = JSON.stringify(d, null, 2);
          $("error").textContent = "";
          $("status").textContent = "配置已保存";
        } catch (err) {
          $("error").textContent = String(err);
        }
      };

      function showOut(blob, mime, filename) {
        const img = $("result");
        const frame = $("html");
        const dl = $("dl");
        img.hidden = true;
        frame.hidden = true;
        dl.hidden = true;
        const url = URL.createObjectURL(blob);
        dl.href = url;
        dl.download = filename || "out";
        dl.hidden = false;
        if (mime.startsWith("image/")) {
          img.src = url;
          img.hidden = false;
        } else if (mime === "text/html") {
          frame.src = url;
          frame.hidden = false;
        }
      }

      async function pollJob(jobId) {
        const res = await fetch("/jobs/" + jobId, { headers: authHeaders() });
        const d = await readJson(res);
        if (!res.ok) throw new Error(d.error || "查询 Job 失败");
        return d;
      }

      $("f").onsubmit = async (e) => {
        e.preventDefault();
        if (!token) {
          $("error").textContent = "请先完成配对";
          return;
        }
        const f = e.target;
        $("status").textContent = "已提交";
        $("error").textContent = "";
        $("result").hidden = true;
        $("html").hidden = true;
        $("dl").hidden = true;
        const fd = new FormData();
        fd.append("image", f.image.files[0]);
        fd.append(
          "overrides",
          JSON.stringify({
            target_lang: f.target_lang.value,
            detector: f.detector.value,
            translator: f.translator.value,
          }),
        );
        let jobId;
        try {
          const res = await fetch("/jobs", { method: "POST", headers: authHeaders(), body: fd });
          const d = await readJson(res);
          if (!res.ok) {
            $("status").textContent = "失败";
            $("error").textContent = d.error || "提交失败";
            return;
          }
          jobId = d.job_id;
        } catch (err) {
          $("status").textContent = "失败";
          $("error").textContent = String(err);
          return;
        }
        while (true) {
          let d;
          try {
            d = await pollJob(jobId);
          } catch (err) {
            $("status").textContent = "失败";
            $("error").textContent = String(err);
            return;
          }
          if (d.state === "queued") {
            $("status").textContent =
              "排队中" + (d.position_in_queue ? "（第 " + d.position_in_queue + " 位）" : "");
          } else if (d.state === "running") {
            $("status").textContent = "运行中";
          } else if (d.state === "done") {
            try {
              const art = await fetch("/jobs/" + jobId + "/artifact", { headers: authHeaders() });
              if (!art.ok) {
                $("status").textContent = "失败";
                $("error").textContent = "读取 Artifact 失败";
                return;
              }
              const mime = art.headers.get("content-type") || "application/octet-stream";
              const blob = await art.blob();
              $("status").textContent = "完成";
              showOut(blob, mime, "out");
            } catch (err) {
              $("status").textContent = "失败";
              $("error").textContent = String(err);
            }
            return;
          } else if (d.state === "cancelled") {
            $("status").textContent = "已取消";
            return;
          } else {
            $("status").textContent = "失败";
            $("error").textContent = d.error || "Job 失败";
            return;
          }
          await new Promise((r) => setTimeout(r, 1000));
        }
      };

      setPairMsg();
      pollEngine();
      setInterval(pollEngine, 3000);
      if (token) loadConfig();
    </script>
  </body>
</html>
